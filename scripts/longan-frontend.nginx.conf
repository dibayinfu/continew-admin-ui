# 前端站点。安装到 /etc/nginx/conf.d/longan-frontend.conf。
# DNS：longan.mozi365.com -> 156.238.249.157（Cloudflare 代理开启）。
server {
    listen 80;
    server_name longan.mozi365.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name longan.mozi365.com;

    ssl_certificate     /etc/nginx/ssl/mozi365.com/mozi365.com.pem;
    ssl_certificate_key /etc/nginx/ssl/mozi365.com/mozi365.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /data/longan/frontend/current;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 同时兼容当前 hash 路由和今后的 history 路由。
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }
}
